<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusTrack 個人工作看板</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .drag-active { background-color: #e0e7ff !important; border: 2px dashed #4f46e5; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const CATEGORIES = ['行政', '教學', '會議', '研發', '業務', '管理', '開發', '行銷', '設計', '其他'];
        const PRIORITIES = ['高', '中', '低'];
        const STATUSES = ['待處理', '進行中', '已完成'];
        
        function App() {
            const [tasks, setTasks] = React.useState([]);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterCategory, setFilterCategory] = React.useState('all');
            const [filterPriority, setFilterPriority] = React.useState('all');
            const [viewMode, setViewMode] = React.useState('board');
            const [currentMonth, setCurrentMonth] = React.useState(new Date());
            const [showForm, setShowForm] = React.useState(false);
            const [editingTask, setEditingTask] = React.useState(null);
            
            // 刪除確認視窗狀態
            const [deleteConfirm, setDeleteConfirm] = React.useState({ show: false, id: null });
            
            // 儲存錯誤提示狀態 (新增)
            const [storageError, setStorageError] = React.useState('');
            
            const [formData, setFormData] = React.useState({
                title: '', deadline: '', category: '行政', priority: '中', status: '待處理', notes: ''
            });

            // 載入資料：自動恢復上次進度 (支援舊版無縫升級至 V2)
            React.useEffect(() => {
                try {
                    let saved = localStorage.getItem('FOCUSTRACK_DATA_V2');
                    if (!saved) {
                        saved = localStorage.getItem('focustrack_tasks'); // 舊版相容
                    }
                    if (saved) setTasks(JSON.parse(saved));
                } catch (e) {
                    console.warn("無法存取 LocalStorage 讀取資料", e);
                }
            }, []);

            // 儲存資料：任何異動自動寫入，具備容量防呆機制
            React.useEffect(() => {
                try {
                    localStorage.setItem('FOCUSTRACK_DATA_V2', JSON.stringify(tasks));
                } catch (e) {
                    console.warn("無法寫入 LocalStorage", e);
                    // 偵測是否為儲存空間不足 (QuotaExceededError)
                    if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
                        setStorageError('瀏覽器儲存空間不足！您的最新修改無法儲存。請清理空間後再試。');
                    } else {
                        setStorageError('儲存資料時發生未知的錯誤，您的最新修改無法保存。請檢查瀏覽器隱私設定。');
                    }
                }
            }, [tasks]);

            // 強制格式化日期顯示 YYYY-MM-DD
            const formatDisplayDate = (dateStr) => {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr; 
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            };

            const changeMonth = (offset) => {
                setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + offset, 1));
            };

            const isSameMonth = (dateString, targetDate) => {
                if (!dateString) return false;
                const d = new Date(dateString);
                if (isNaN(d.getTime())) return false;
                return d.getFullYear() === targetDate.getFullYear() && d.getMonth() === targetDate.getMonth();
            };

            const filteredTasks = tasks.filter(task => {
                const searchLower = searchTerm.toLowerCase();
                const matchSearch = String(task.title || '').toLowerCase().includes(searchLower) || 
                                    String(task.notes || '').toLowerCase().includes(searchLower);
                const matchCategory = filterCategory === 'all' || task.category === filterCategory;
                const matchPriority = filterPriority === 'all' || task.priority === filterPriority;
                const matchMonth = isSameMonth(task.deadline, currentMonth);
                return matchSearch && matchCategory && matchPriority && matchMonth;
            }).sort((a, b) => new Date(a.deadline || 0) - new Date(b.deadline || 0));

            const getPriorityColor = (p) => {
                if (p === '高') return 'bg-red-100 text-red-700';
                if (p === '中') return 'bg-blue-100 text-blue-700';
                return 'bg-gray-100 text-gray-700';
            };

            const getDeadlineBadge = (deadline, status) => {
                if (status === '已完成' || !deadline) return null;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const dl = new Date(deadline);
                if(isNaN(dl.getTime())) return null;
                dl.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((dl - today) / (1000 * 60 * 60 * 24));

                if (diffDays < 0) return <span className="inline-block mt-2 bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">🔴 已逾期</span>;
                if (diffDays === 0) return <span className="inline-block mt-2 bg-orange-100 text-orange-700 px-2 py-1 rounded text-xs font-bold">🟠 今天到期</span>;
                if (diffDays === 1) return <span className="inline-block mt-2 bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs font-bold">🟡 明天到期</span>;
                return null;
            };

            const resetForm = () => {
                setFormData({ title: '', deadline: '', category: '行政', priority: '中', status: '待處理', notes: '' });
                setEditingTask(null);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (editingTask) {
                    setTasks(tasks.map(t => t.id === editingTask.id ? { ...formData, id: t.id } : t));
                } else {
                    setTasks([...tasks, { ...formData, id: Date.now().toString() }]);
                }
                setShowForm(false);
                resetForm();
            };

            const confirmDelete = () => {
                if (deleteConfirm.id) {
                    setTasks(tasks.filter(t => t.id !== deleteConfirm.id));
                }
                setDeleteConfirm({ show: false, id: null });
            };

            const onDragStart = (e, id) => e.dataTransfer.setData('taskId', id);
            const onDragOver = e => { e.preventDefault(); e.currentTarget.classList.add('drag-active'); };
            const onDragLeave = e => e.currentTarget.classList.remove('drag-active');
            const onDrop = (e, status) => {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-active');
                const id = e.dataTransfer.getData('taskId');
                setTasks(tasks.map(t => t.id === id ? { ...t, status } : t));
            };

            const generateFilename = (prefix, ext) => {
                const now = new Date();
                const ts = now.getFullYear().toString() +
                    (now.getMonth() + 1).toString().padStart(2, '0') +
                    now.getDate().toString().padStart(2, '0') + '_' +
                    now.getHours().toString().padStart(2, '0') +
                    now.getMinutes().toString().padStart(2, '0') +
                    now.getSeconds().toString().padStart(2, '0');
                return `${prefix}_${ts}.${ext}`;
            };

            // Excel 處理
            const parseExcelDate = (excelDate) => {
                if (!excelDate) return '';
                if (!isNaN(excelDate) && typeof excelDate === 'number') {
                    const date = new Date(Math.round((excelDate - 25569) * 86400 * 1000));
                    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                }
                const d = new Date(String(excelDate).replace(/\//g, '-'));
                if (!isNaN(d.getTime())) {
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                }
                return String(excelDate);
            };

            const handleExportExcel = async () => {
                try {
                    const workbook = new ExcelJS.Workbook();
                    const worksheet = workbook.addWorksheet('工作進度');
                    worksheet.columns = [
                        { header: '工作標題', key: 'title', width: 30 },
                        { header: '截止日期', key: 'deadline', width: 15 },
                        { header: '分類', key: 'category', width: 15 },
                        { header: '優先度', key: 'priority', width: 10 },
                        { header: '狀態', key: 'status', width: 15 },
                        { header: '備註', key: 'notes', width: 40 }
                    ];

                    tasks.forEach(task => {
                        worksheet.addRow({ ...task, deadline: formatDisplayDate(task.deadline) });
                    });

                    for (let i = 2; i <= tasks.length + 100; i++) {
                        worksheet.getCell(`C${i}`).dataValidation = { type: 'list', allowBlank: true, formulae: [`"${CATEGORIES.join(',')}"`] };
                        worksheet.getCell(`D${i}`).dataValidation = { type: 'list', allowBlank: true, formulae: [`"${PRIORITIES.join(',')}"`] };
                        worksheet.getCell(`E${i}`).dataValidation = { type: 'list', allowBlank: true, formulae: [`"${STATUSES.join(',')}"`] };
                    }

                    worksheet.getRow(1).font = { bold: true };
                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = generateFilename('工作清單匯出', 'xlsx');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (e) {
                    alert("匯出 Excel 發生錯誤");
                }
            };

            const handleImportExcel = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                try {
                    const workbook = new ExcelJS.Workbook();
                    await workbook.xlsx.load(file);
                    const worksheet = workbook.getWorksheet(1);
                    
                    let updatedTasks = [...tasks];
                    let addedCount = 0;
                    let updatedCount = 0;

                    worksheet.eachRow((row, rowNumber) => {
                        if (rowNumber === 1) return;
                        
                        const title = String(row.getCell(1).value || '未命名工作');
                        const deadline = parseExcelDate(row.getCell(2).value);
                        const category = String(row.getCell(3).value || '');
                        const priority = String(row.getCell(4).value || '');
                        const status = String(row.getCell(5).value || '');
                        const notes = String(row.getCell(6).value || '');

                        const validCategory = CATEGORIES.includes(category) ? category : '管理';
                        const validPriority = PRIORITIES.includes(priority) ? priority : '中';
                        const validStatus = STATUSES.includes(status) ? status : '待處理';

                        // Upsert 邏輯
                        const existingIdx = updatedTasks.findIndex(t => t.title === title && formatDisplayDate(t.deadline) === deadline);
                        
                        if (existingIdx !== -1) {
                            updatedTasks[existingIdx] = { 
                                ...updatedTasks[existingIdx], category: validCategory, priority: validPriority, status: validStatus, notes: notes 
                            };
                            updatedCount++;
                        } else {
                            updatedTasks.push({
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                                title, deadline, category: validCategory, priority: validPriority, status: validStatus, notes
                            });
                            addedCount++;
                        }
                    });

                    setTasks(updatedTasks);
                    alert(`匯入完成！新增 ${addedCount} 筆，更新 ${updatedCount} 筆工作。`);
                } catch (error) {
                    alert("讀取檔案失敗，請確保格式正確");
                }
                e.target.value = null;
            };

            const handleExportCSV = () => {
                const headers = ['Subject', 'Start Date', 'All Day Event', 'Description'];
                const csvRows = [headers.join(',')];

                // 【新增機制】使用 Map 來過濾重複的工作 (標題 + 截止日期 相同視為重複)
                const uniqueTasksMap = new Map();
                filteredTasks.forEach(task => {
                    const key = `${task.title}_${formatDisplayDate(task.deadline)}`;
                    if (!uniqueTasksMap.has(key)) {
                        uniqueTasksMap.set(key, task);
                    }
                });

                // 針對濾重後的乾淨清單進行 CSV 轉換
                uniqueTasksMap.forEach(task => {
                    const subject = `"${String(task.title).replace(/"/g, '""')}"`;
                    const startDate = `"${formatDisplayDate(task.deadline)}"`;
                    const allDay = `"True"`;
                    
                    const safeNotes = String(task.notes || '').replace(/\r?\n/g, ' '); 
                    const descText = `分類：${task.category} | 優先度：${task.priority} | 狀態：${task.status} | 備註：${safeNotes}`;
                    const description = `"${descText.replace(/"/g, '""')}"`;
                    
                    csvRows.push([subject, startDate, allDay, description].join(','));
                });

                const csvString = '\uFEFF' + csvRows.join('\r\n');
                const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = generateFilename('行事曆匯出', 'csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const renderCalendar = () => {
                const year = currentMonth.getFullYear();
                const month = currentMonth.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(<div key={`empty-${i}`} className="p-2 bg-gray-50 border border-gray-100"></div>);
                
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const dayTasks = filteredTasks.filter(t => formatDisplayDate(t.deadline) === dateStr);
                    
                    const todayStr = formatDisplayDate(new Date());
                    const hasOverdue = dayTasks.some(t => t.status !== '已完成' && dateStr < todayStr);
                    const hasToday = dayTasks.some(t => t.status !== '已完成' && dateStr === todayStr);
                    
                    days.push(
                        <div key={i} className="min-h-[100px] p-2 bg-white border border-gray-200 hover:bg-indigo-50 group">
                            <div className="font-bold text-gray-500 mb-1">{i}</div>
                            <div className="flex flex-col gap-1">
                                {dayTasks.map(t => (
                                    <div key={t.id} onClick={() => { setEditingTask(t); setFormData(t); setShowForm(true); }}
                                         className="text-xs p-1 bg-gray-100 rounded truncate cursor-pointer hover:bg-indigo-200 border-l-2 border-indigo-500"
                                         title={t.title}>
                                        {hasOverdue && t.status !== '已完成' ? '🔴 ' : hasToday && t.status !== '已完成' ? '🟠 ' : ''}
                                        {t.title}
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="mt-6 bg-white rounded-xl shadow p-4">
                        <div className="grid grid-cols-7 gap-px text-center font-bold text-gray-600 mb-2">
                            <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                        </div>
                        <div className="grid grid-cols-7 gap-px bg-gray-200">
                            {days}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-7xl mx-auto">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                            <div>
                                <h1 className="text-3xl font-bold text-gray-800">🎯 FocusTrack 個人工作看板</h1>
                                <p className="text-gray-500 mt-1">資料安全儲存於您的瀏覽器中</p>
                            </div>
                            <div className="flex gap-4">
                                <div className="bg-white px-4 py-2 rounded-lg shadow text-center">
                                    <div className="text-2xl font-bold text-blue-600">{filteredTasks.filter(t => t.status === '待處理').length}</div>
                                    <div className="text-xs text-gray-500">待處理</div>
                                </div>
                                <div className="bg-white px-4 py-2 rounded-lg shadow text-center">
                                    <div className="text-2xl font-bold text-orange-500">{filteredTasks.filter(t => t.status === '進行中').length}</div>
                                    <div className="text-xs text-gray-500">進行中</div>
                                </div>
                                <div className="bg-white px-4 py-2 rounded-lg shadow text-center">
                                    <div className="text-2xl font-bold text-green-500">{filteredTasks.filter(t => t.status === '已完成').length}</div>
                                    <div className="text-xs text-gray-500">已完成</div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
                            <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                                <div className="flex items-center bg-gray-50 border border-gray-200 rounded-lg px-2 py-1">
                                    <button onClick={() => changeMonth(-1)} className="p-2 hover:bg-gray-200 rounded">{'<'}</button>
                                    <span className="font-bold px-2">{currentMonth.getFullYear()}年{currentMonth.getMonth() + 1}月</span>
                                    <button onClick={() => changeMonth(1)} className="p-2 hover:bg-gray-200 rounded">{'>'}</button>
                                </div>
                                <input type="text" placeholder="🔍 搜尋工作..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                                    className="px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 flex-1 md:w-48" />
                                <select value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)} className="px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 flex-1 md:flex-none">
                                    <option value="all">所有分類</option>
                                    {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>

                            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto mt-2 md:mt-0">
                                <button onClick={() => setViewMode(viewMode === 'board' ? 'calendar' : 'board')} className="flex items-center gap-2 px-4 py-2 text-gray-700 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 flex-1 md:flex-none justify-center">
                                    {viewMode === 'board' ? '📅 行事曆' : '🗂️ 看板'}
                                </button>
                                <label className="flex items-center gap-2 px-4 py-2 text-gray-700 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer flex-1 md:flex-none justify-center">
                                    <span>📤 匯入 EXCEL</span>
                                    <input type="file" accept=".xlsx" onChange={handleImportExcel} className="hidden" />
                                </label>
                                <button onClick={handleExportExcel} className="flex items-center gap-2 px-4 py-2 text-green-700 bg-green-50 border border-green-200 rounded-lg hover:bg-green-100 flex-1 md:flex-none justify-center">
                                    📥 匯出 EXCEL
                                </button>
                                <button onClick={handleExportCSV} className="flex items-center gap-2 px-4 py-2 text-blue-700 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100 flex-1 md:flex-none justify-center" title="匯出相容於 Google 行事曆的 CSV">
                                    🗓️ 匯出 CSV 給 Google 行事曆用
                                </button>
                                <button onClick={() => { resetForm(); setShowForm(true); }} className="flex items-center gap-2 px-4 py-2 text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 flex-1 md:flex-none justify-center font-medium">
                                    ＋ 新增工作
                                </button>
                            </div>
                        </div>

                        {viewMode === 'board' ? (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {STATUSES.map(status => (
                                    <div key={status} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={(e) => onDrop(e, status)} className="bg-gray-100 rounded-xl p-4 transition-colors">
                                        <h2 className="font-bold text-gray-700 mb-4 flex items-center justify-between">
                                            {status}
                                            <span className="bg-white text-gray-500 px-2 py-1 rounded text-sm">{filteredTasks.filter(t => t.status === status).length}</span>
                                        </h2>
                                        <div className="flex flex-col gap-3 min-h-[200px]">
                                            {filteredTasks.filter(t => t.status === status).map(task => (
                                                <div key={task.id} draggable onDragStart={(e) => onDragStart(e, task.id)} className="bg-white p-4 rounded-lg shadow-sm cursor-move hover:shadow-md transition-shadow border border-gray-100">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className={`text-xs px-2 py-1 rounded font-medium ${getPriorityColor(task.priority)}`}>{task.priority}</span>
                                                        <span className="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">{task.category}</span>
                                                    </div>
                                                    <h3 className="font-bold text-gray-800 mb-1">{task.title}</h3>
                                                    {task.deadline && <div className="text-sm text-gray-500 flex flex-col items-start mb-2"><span>📅 {formatDisplayDate(task.deadline)}</span>{getDeadlineBadge(task.deadline, task.status)}</div>}
                                                    {task.notes && <p className="text-sm text-gray-600 bg-gray-50 p-2 rounded mt-2 truncate">{task.notes}</p>}
                                                    <div className="flex justify-end gap-2 mt-3 pt-3 border-t border-gray-50">
                                                        <button onClick={() => { setEditingTask(task); setFormData({...task, deadline: formatDisplayDate(task.deadline)}); setShowForm(true); }} className="text-indigo-600 hover:text-indigo-800 text-sm font-medium">編輯</button>
                                                        <button onClick={() => setDeleteConfirm({ show: true, id: task.id })} className="text-red-500 hover:text-red-700 text-sm font-medium">刪除</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            renderCalendar()
                        )}

                        {/* 新增/編輯 表單 Modal */}
                        {showForm && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
                                    <div className="bg-indigo-600 px-6 py-4 flex justify-between items-center">
                                        <h2 className="text-xl font-bold text-white">{editingTask ? '編輯工作' : '新增工作'}</h2>
                                        <button onClick={() => setShowForm(false)} className="text-white hover:text-indigo-200 font-bold text-xl">×</button>
                                    </div>
                                    <form onSubmit={handleSubmit} className="p-6">
                                        <div className="space-y-4">
                                            <div><label className="block text-sm font-bold text-gray-700 mb-1">工作標題 *</label><input type="text" required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" /></div>
                                            <div><label className="block text-sm font-bold text-gray-700 mb-1">截止日期</label><input type="date" value={formData.deadline} onChange={e => setFormData({...formData, deadline: e.target.value})} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" /></div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="block text-sm font-bold text-gray-700 mb-1">分類</label><select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">{CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                                <div><label className="block text-sm font-bold text-gray-700 mb-1">優先度</label><select value={formData.priority} onChange={e => setFormData({...formData, priority: e.target.value})} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">{PRIORITIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                            </div>
                                            <div><label className="block text-sm font-bold text-gray-700 mb-1">狀態</label><select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">{STATUSES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                            <div><label className="block text-sm font-bold text-gray-700 mb-1">備註</label><textarea value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" rows="3"></textarea></div>
                                        </div>
                                        <div className="mt-6 flex justify-end gap-3">
                                            <button type="button" onClick={() => setShowForm(false)} className="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium">取消</button>
                                            <button type="submit" className="px-4 py-2 text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg font-medium">儲存</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* 自訂刪除確認 Modal */}
                        {deleteConfirm.show && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden p-6 text-center">
                                    <div className="text-red-500 text-5xl mb-4">⚠️</div>
                                    <h3 className="text-xl font-bold text-gray-800 mb-2">確定要刪除嗎？</h3>
                                    <p className="text-gray-500 mb-6">刪除後將無法復原這筆工作。</p>
                                    <div className="flex justify-center gap-3">
                                        <button onClick={() => setDeleteConfirm({ show: false, id: null })} className="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium">取消</button>
                                        <button onClick={confirmDelete} className="px-4 py-2 text-white bg-red-600 hover:bg-red-700 rounded-lg font-medium">確定刪除</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 儲存失敗警告 Modal (新增) */}
                        {storageError && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden p-6 text-center">
                                    <div className="text-red-500 text-5xl mb-4">💾</div>
                                    <h3 className="text-xl font-bold text-gray-800 mb-2">儲存失敗</h3>
                                    <p className="text-gray-500 mb-6 text-sm">{storageError}</p>
                                    <div className="flex justify-center">
                                        <button onClick={() => setStorageError('')} className="px-4 py-2 text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg font-medium">我知道了</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
