<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人工作備忘錄</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STORAGE_KEY = 'FOCUSTRACK_DATA_V2';
        const CATEGORIES = ['行政', '研發', '教學', '業務', '會議', '行銷', '企劃', '活動', '財務', '進修'];
        const PRIORITIES = ['高', '中', '低'];
        const STATUSES = ['待處理', '進行中', '已完成'];

        const FocusTrackApp = () => {
            const [tasks, setTasks] = useState([]);
            
            // 視圖切換狀態 (看板 vs 行事曆)
            const [viewMode, setViewMode] = useState('kanban');
            const [calendarDate, setCalendarDate] = useState(new Date());

            // 搜尋與篩選狀態
            const [searchQuery, setSearchQuery] = useState('');
            const [filterCategory, setFilterCategory] = useState('所有分類');

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingTask, setEditingTask] = useState(null);
            const [isDeleteModalOpen, setIsDeleteModalOpen] = useState(false);
            const [taskToDelete, setTaskToDelete] = useState(null);
            const [isStorageFull, setIsStorageFull] = useState(false);
            const [formData, setFormData] = useState({
                title: '', deadline: '', category: '行政', priority: '中', status: '待處理', notes: ''
            });

            // 初始載入
            useEffect(() => {
                const savedTasks = localStorage.getItem(STORAGE_KEY);
                if (savedTasks) {
                    try { setTasks(JSON.parse(savedTasks)); } catch (e) { console.error(e); }
                }
            }, []);

            // 自動儲存與容量防呆
            useEffect(() => {
                if (tasks.length > 0) {
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                        setIsStorageFull(false);
                    } catch (e) {
                        if (e.name === 'QuotaExceededError' || e.code === 22) setIsStorageFull(true);
                    }
                } else if (tasks.length === 0 && localStorage.getItem(STORAGE_KEY)) {
                    localStorage.removeItem(STORAGE_KEY);
                }
            }, [tasks]);

            // 過濾後的任務清單
            const filteredTasks = useMemo(() => {
                return tasks.filter(task => {
                    const matchesSearch = task.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          (task.notes && task.notes.toLowerCase().includes(searchQuery.toLowerCase()));
                    const matchesCategory = filterCategory === '所有分類' || task.category === filterCategory;
                    return matchesSearch && matchesCategory;
                });
            }, [tasks, searchQuery, filterCategory]);

            const standardizeDate = (dateInput) => {
                if (!dateInput) return '';
                let d = typeof dateInput === 'number' ? new Date(Math.round((dateInput - 25569) * 86400 * 1000)) : new Date(dateInput);
                return isNaN(d.getTime()) ? String(dateInput) : d.toISOString().split('T')[0];
            };

            const checkOverdue = (deadline) => {
                if (!deadline) return null;
                const dlDate = new Date(deadline);
                if (isNaN(dlDate.getTime())) return null;
                dlDate.setHours(0, 0, 0, 0);
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((dlDate - today) / 86400000);
                if (diffDays < 0) return { text: '已逾期', color: 'bg-red-100 text-red-700', light: '🔴' };
                if (diffDays === 0) return { text: '今天到期', color: 'bg-red-100 text-red-700', light: '🔴' };
                if (diffDays === 1) return { text: '明天到期', color: 'bg-yellow-100 text-yellow-700', light: '🟡' };
                return { text: null, color: null, light: '🟢' };
            };

            // 行事曆輔助函數
            const nextMonth = () => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1));
            const prevMonth = () => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1));

            const getTimestampStr = () => {
                const d = new Date();
                const pad = (n) => String(n).padStart(2, '0');
                return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const processedDate = standardizeDate(formData.deadline);
                if (editingTask) {
                    setTasks(tasks.map(t => t.id === editingTask.id ? { ...formData, deadline: processedDate, id: t.id } : t));
                } else {
                    setTasks([...tasks, { ...formData, deadline: processedDate, id: Date.now().toString() }]);
                }
                closeModal();
            };

            const closeModal = () => { setIsModalOpen(false); setEditingTask(null); setFormData({ title: '', deadline: '', category: '行政', priority: '中', status: '待處理', notes: '' }); };
            const openEditModal = (task) => { setFormData(task); setEditingTask(task); setIsModalOpen(true); };
            const requestDelete = (task) => { setTaskToDelete(task); setIsDeleteModalOpen(true); };
            const confirmDelete = () => { if (taskToDelete) setTasks(tasks.filter(t => t.id !== taskToDelete.id)); setIsDeleteModalOpen(false); setTaskToDelete(null); };

            const handleDragStart = (e, taskId) => e.dataTransfer.setData('taskId', taskId);
            const handleDrop = (e, newStatus) => {
                e.preventDefault();
                const taskId = e.dataTransfer.getData('taskId');
                setTasks(tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t));
            };

            const handleImportExcel = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const data = XLSX.utils.sheet_to_json(XLSX.read(evt.target.result, { type: 'binary' }).Sheets[XLSX.read(evt.target.result, { type: 'binary' }).SheetNames[0]]);
                    let updatedTasks = [...tasks];
                    data.forEach(row => {
                        const stdDate = standardizeDate(row['截止日期']);
                        const existingIndex = updatedTasks.findIndex(t => t.title === row['工作標題'] && t.deadline === stdDate);
                        const newTask = {
                            id: existingIndex >= 0 ? updatedTasks[existingIndex].id : Date.now().toString() + Math.random().toString(36).substr(2, 9),
                            title: row['工作標題'] || '未命名工作', deadline: stdDate, category: row['分類'] || '行政', priority: row['優先度'] || '中', status: row['狀態'] || '待處理', notes: row['備註'] || ''
                        };
                        existingIndex >= 0 ? updatedTasks[existingIndex] = newTask : updatedTasks.push(newTask);
                    });
                    setTasks(updatedTasks); e.target.value = ''; 
                };
                reader.readAsBinaryString(file);
            };

            const handleExportExcel = async () => {
                const timestamp = getTimestampStr();
                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet('工作清單');

                worksheet.columns = [
                    { header: '工作標題', key: 'title', width: 30 },
                    { header: '截止日期', key: 'deadline', width: 15 },
                    { header: '分類', key: 'category', width: 15 },
                    { header: '優先度', key: 'priority', width: 15 },
                    { header: '狀態', key: 'status', width: 15 },
                    { header: '備註', key: 'notes', width: 40 }
                ];

                tasks.forEach(t => {
                    worksheet.addRow({
                        title: t.title, deadline: t.deadline, category: t.category, 
                        priority: t.priority, status: t.status, notes: t.notes
                    });
                });

                const catStr = `"${CATEGORIES.join(',')}"`;
                const prioStr = `"${PRIORITIES.join(',')}"`;
                const statStr = `"${STATUSES.join(',')}"`;

                for (let i = 2; i <= 500; i++) {
                    worksheet.getCell(`C${i}`).dataValidation = { type: 'list', allowBlank: true, formulae: [catStr] };
                    worksheet.getCell(`D${i}`).dataValidation = { type: 'list', allowBlank: true, formulae: [prioStr] };
                    worksheet.getCell(`E${i}`).dataValidation = { type: 'list', allowBlank: true, formulae: [statStr] };
                }

                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `備忘錄_${timestamp}.xlsx`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleExportCSV = () => {
                const timestamp = getTimestampStr();
                const csvRows = [['Subject', 'Start Date', 'All Day Event', 'Description'].join(',')];
                const uniqueTasksMap = new Map();
                tasks.forEach(task => uniqueTasksMap.set(`${task.title}_${task.deadline}`, task));
                uniqueTasksMap.forEach(task => {
                    const descText = `分類：${task.category} | 優先度：${task.priority} | 狀態：${task.status} | 備註：${String(task.notes || '').replace(/\r?\n/g, ' ')}`;
                    csvRows.push([`"${String(task.title).replace(/"/g, '""')}"`, `"${task.deadline}"`, `"True"`, `"${descText.replace(/"/g, '""')}"`].join(','));
                });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob(['\uFEFF' + csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' }));
                link.download = `Google行事曆匯出_${timestamp}.csv`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const handleGoogleCalendarSync = (task) => {
                let dates = '';
                if (task.deadline) {
                    const d = new Date(task.deadline);
                    const nextD = new Date(d); nextD.setDate(nextD.getDate() + 1);
                    dates = `&dates=${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}/${nextD.getFullYear()}${String(nextD.getMonth() + 1).padStart(2, '0')}${String(nextD.getDate()).padStart(2, '0')}`;
                }
                window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(task.title)}${dates}&details=${encodeURIComponent(`分類：${task.category}\n狀態：${task.status}\n備註：${String(task.notes || '').replace(/\r?\n/g, ' ')}`)}`, '_blank');
            };

            const getPriorityColor = (p) => p === '高' ? 'text-red-600 bg-red-50' : p === '中' ? 'text-blue-600 bg-blue-50' : 'text-green-600 bg-green-50';

            return (
                <div className="min-h-screen p-4 max-w-7xl mx-auto">
                    {/* Header 區塊 */}
                    <div className="mb-6 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        {/* 第一排：標題 與 統計數字 */}
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-6">
                            <div>
                                <h1 className="text-3xl font-bold text-gray-800 flex items-center gap-3">
                                    <span className="text-4xl">🎯</span> 個人工作備忘錄
                                </h1>
                                <p className="text-sm text-gray-500 mt-2 font-medium">
                                    自動儲存防護中 | 資料安全存放於本機
                                </p>
                            </div>

                            {/* 新增：動態統計數字區塊 */}
                            <div className="flex gap-3">
                                <div className="bg-white border border-gray-100 shadow-sm rounded-xl px-6 py-3 text-center min-w-[100px] flex flex-col justify-center">
                                    <div className="text-3xl font-bold text-blue-600 mb-1">{tasks.filter(t => t.status === '待處理').length}</div>
                                    <div className="text-sm text-gray-500 font-medium">待處理</div>
                                </div>
                                <div className="bg-white border border-gray-100 shadow-sm rounded-xl px-6 py-3 text-center min-w-[100px] flex flex-col justify-center">
                                    <div className="text-3xl font-bold text-orange-500 mb-1">{tasks.filter(t => t.status === '進行中').length}</div>
                                    <div className="text-sm text-gray-500 font-medium">進行中</div>
                                </div>
                                <div className="bg-white border border-gray-100 shadow-sm rounded-xl px-6 py-3 text-center min-w-[100px] flex flex-col justify-center">
                                    <div className="text-3xl font-bold text-green-500 mb-1">{tasks.filter(t => t.status === '已完成').length}</div>
                                    <div className="text-sm text-gray-500 font-medium">已完成</div>
                                </div>
                            </div>
                        </div>

                        {/* 第二排：搜尋篩選 與 動作按鈕 */}
                        <div className="pt-5 border-t border-gray-100 flex flex-col xl:flex-row justify-between gap-4">
                            {/* 搜尋與篩選 */}
                            <div className="flex flex-col sm:flex-row gap-3 flex-1">
                                <div className="relative flex-1 max-w-md">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">🔍</span>
                                    <input 
                                        type="text" 
                                        placeholder="搜尋工作..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm"
                                    />
                                </div>
                                <select 
                                    value={filterCategory}
                                    onChange={(e) => setFilterCategory(e.target.value)}
                                    className="px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm font-medium text-gray-700 min-w-[140px] cursor-pointer"
                                >
                                    <option value="所有分類">所有分類</option>
                                    {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>

                            {/* 動作按鈕區 (樣式對齊圖片設計) */}
                            <div className="flex flex-wrap gap-2 justify-start xl:justify-end">
                                <button onClick={() => setViewMode(viewMode === 'kanban' ? 'calendar' : 'kanban')} className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2.5 rounded-lg text-sm font-bold transition-colors shadow-sm">
                                    {viewMode === 'kanban' ? '📅 切換行事曆' : '📋 切換看板'}
                                </button>
                                <label className="cursor-pointer bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 px-4 py-2.5 rounded-lg text-sm font-bold transition-colors flex items-center gap-2 shadow-sm">
                                    <span className="text-blue-500 text-lg">📥</span> 匯入 EXCEL 
                                    <input type="file" accept=".xlsx, .xls" className="hidden" onChange={handleImportExcel} />
                                </label>
                                <button onClick={handleExportExcel} className="bg-green-50 border border-green-200 hover:bg-green-100 text-green-700 px-4 py-2.5 rounded-lg text-sm font-bold transition-colors flex items-center gap-2 shadow-sm">
                                    <span className="text-green-600 text-lg">📤</span> 匯出 EXCEL
                                </button>
                                <button onClick={handleExportCSV} className="bg-purple-50 border border-purple-200 hover:bg-purple-100 text-purple-700 px-4 py-2.5 rounded-lg text-sm font-bold transition-colors shadow-sm">
                                    🗓️ 匯出 CSV
                                </button>
                                <button onClick={() => setIsModalOpen(true)} className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg text-sm font-bold shadow-sm transition-colors flex items-center gap-1">
                                    ＋ 新增工作
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 看板區域 */}
                    {viewMode === 'kanban' && (
                        <div className="flex gap-6 overflow-x-auto pb-4 hide-scrollbar">
                            {STATUSES.map(status => {
                                // 使用過濾後的資料來計算該欄位的工作
                                const columnTasks = filteredTasks.filter(t => t.status === status);
                                return (
                                    <div key={status} className="flex-1 min-w-[320px] bg-gray-50 rounded-xl p-4 border border-gray-200" onDragOver={e => e.preventDefault()} onDrop={e => handleDrop(e, status)}>
                                        <div className="flex justify-between items-center mb-4 px-2">
                                            <h3 className="font-semibold text-gray-700 text-lg">{status}</h3>
                                            <span className="bg-white text-gray-500 text-xs font-bold px-3 py-1 rounded-full shadow-sm">{columnTasks.length}</span>
                                        </div>
                                        <div className="space-y-3">
                                            {columnTasks.sort((a, b) => new Date(a.deadline || '9999-12-31') - new Date(b.deadline || '9999-12-31')).map(task => {
                                                const overdueInfo = checkOverdue(task.deadline);
                                                return (
                                                    <div key={task.id} draggable onDragStart={e => handleDragStart(e, task.id)} className="bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition-all cursor-move border border-gray-100 group">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <span className={`text-xs font-bold px-2 py-1 rounded ${getPriorityColor(task.priority)}`}>{task.priority}</span>
                                                            <span className="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">{task.category}</span>
                                                        </div>
                                                        <h4 className="font-bold text-gray-800 mb-2 leading-tight">
                                                            {status !== '已完成' && overdueInfo && <span className="mr-1">{overdueInfo.light}</span>}
                                                            {task.title}
                                                        </h4>
                                                        {task.deadline && (
                                                            <div className="flex items-center text-sm text-gray-500 mb-3 gap-2">
                                                                <span>📅 {standardizeDate(task.deadline)}</span>
                                                                {status !== '已完成' && overdueInfo && overdueInfo.text && <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${overdueInfo.color}`}>{overdueInfo.text}</span>}
                                                            </div>
                                                        )}
                                                        {task.notes && <div className="text-sm text-gray-600 bg-gray-50 p-2 rounded mb-3 line-clamp-2">{task.notes}</div>}
                                                        <div className="flex justify-between items-center pt-2 mt-2 border-t border-gray-50">
                                                            <button onClick={() => handleGoogleCalendarSync(task)} className="text-xs text-blue-600 hover:text-blue-800 font-medium px-2 py-1 bg-blue-50 hover:bg-blue-100 rounded transition-colors">📅 加到行事曆</button>
                                                            <div className="flex gap-3">
                                                                <button onClick={() => openEditModal(task)} className="text-sm text-indigo-600 hover:text-indigo-800 font-medium">編輯</button>
                                                                <button onClick={() => requestDelete(task)} className="text-sm text-red-500 hover:text-red-700 font-medium">刪除</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            {columnTasks.length === 0 && (
                                                <div className="text-center py-6 text-sm text-gray-400 border-2 border-dashed border-gray-200 rounded-xl">
                                                    無符合工作
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* 行事曆視圖區域 */}
                    {viewMode === 'calendar' && (
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 overflow-x-auto min-w-[800px]">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-bold text-gray-800">
                                    {calendarDate.getFullYear()} 年 {calendarDate.getMonth() + 1} 月
                                </h2>
                                <div className="flex gap-2">
                                    <button onClick={prevMonth} className="px-4 py-2 bg-gray-100 rounded-lg hover:bg-gray-200 font-bold transition-colors">◀</button>
                                    <button onClick={() => setCalendarDate(new Date())} className="px-4 py-2 bg-gray-100 rounded-lg hover:bg-gray-200 text-sm font-medium transition-colors">今天</button>
                                    <button onClick={nextMonth} className="px-4 py-2 bg-gray-100 rounded-lg hover:bg-gray-200 font-bold transition-colors">▶</button>
                                </div>
                            </div>
                            <div className="grid grid-cols-7 gap-px bg-gray-200 rounded-xl overflow-hidden border border-gray-200">
                                {['日', '一', '二', '三', '四', '五', '六'].map(day => (
                                    <div key={day} className="bg-gray-50 text-center py-3 font-bold text-gray-600 text-sm">{day}</div>
                                ))}
                                {(() => {
                                    const year = calendarDate.getFullYear();
                                    const month = calendarDate.getMonth();
                                    const firstDay = new Date(year, month, 1).getDay();
                                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                                    const days = [];
                                    
                                    for (let i = 0; i < firstDay; i++) {
                                        days.push(<div key={`empty-${i}`} className="bg-gray-50 min-h-[140px]"></div>);
                                    }
                                    
                                    for (let d = 1; d <= daysInMonth; d++) {
                                        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                        const dayTasks = filteredTasks.filter(t => standardizeDate(t.deadline) === dateStr);
                                        const isToday = standardizeDate(new Date()) === dateStr;
                                        
                                        days.push(
                                            <div key={d} className={`bg-white min-h-[140px] p-2 flex flex-col group transition-colors hover:bg-gray-50 ${isToday ? 'bg-blue-50/30' : ''}`}>
                                                <div className={`text-right text-sm font-medium mb-2 ${isToday ? 'text-blue-600 font-bold' : 'text-gray-500'}`}>
                                                    <span className={isToday ? 'bg-blue-100 px-2 py-0.5 rounded-full' : ''}>{d}</span>
                                                </div>
                                                <div className="flex-1 flex flex-col gap-1.5 overflow-y-auto hide-scrollbar">
                                                    {dayTasks.map(task => {
                                                        const taskOverdue = checkOverdue(task.deadline);
                                                        return (
                                                            <div 
                                                                key={task.id} 
                                                                onClick={() => openEditModal(task)}
                                                                className={`text-xs px-2 py-1.5 rounded cursor-pointer truncate font-medium shadow-sm transition-opacity hover:opacity-80 border-l-2 ${
                                                                    task.priority === '高' ? 'bg-red-50 text-red-700 border-red-500' : 
                                                                    task.priority === '中' ? 'bg-blue-50 text-blue-700 border-blue-500' : 
                                                                    'bg-green-50 text-green-700 border-green-500'
                                                                } ${task.status === '已完成' ? 'opacity-50 line-through' : ''}`}
                                                                title={`狀態: ${task.status}\n備註: ${task.notes || '無'}`}
                                                            >
                                                                {task.status !== '已完成' && taskOverdue && <span className="mr-1">{taskOverdue.light}</span>}
                                                                {task.title}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    }
                                    return days;
                                })()}
                            </div>
                        </div>
                    )}

                    {/* Modal 與 彈出視窗 */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
                                <div className="bg-gray-50 px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-gray-800">{editingTask ? '編輯工作' : '新增工作'}</h3>
                                    <button onClick={closeModal} className="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
                                </div>
                                <form onSubmit={handleSubmit} className="p-6 space-y-4">
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">工作標題 *</label><input required type="text" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-sm font-medium text-gray-700 mb-1">截止日期</label><input type="date" value={standardizeDate(formData.deadline)} onChange={e => setFormData({...formData, deadline: e.target.value})} className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-1">優先度</label><select value={formData.priority} onChange={e => setFormData({...formData, priority: e.target.value})} className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">{PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}</select></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-sm font-medium text-gray-700 mb-1">分類</label><select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">{CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-1">狀態</label><select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">{STATUSES.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                                    </div>
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">備註</label><textarea value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} rows="3" className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea></div>
                                    <div className="pt-4 flex justify-end gap-3"><button type="button" onClick={closeModal} className="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">取消</button><button type="submit" className="px-4 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg font-medium shadow-sm transition-colors">儲存</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                    {isDeleteModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[60]">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 text-center">
                                <div className="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4"><span className="text-red-500 text-2xl">⚠️</span></div>
                                <h3 className="text-lg font-bold text-gray-900 mb-2">確定要刪除這筆工作嗎？</h3><p className="text-sm text-gray-500 mb-6 break-all">「{taskToDelete && taskToDelete.title}」刪除後將無法復原。</p>
                                <div className="flex justify-center gap-3"><button onClick={() => setIsDeleteModalOpen(false)} className="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors w-full">取消</button><button onClick={confirmDelete} className="px-4 py-2 text-white bg-red-600 hover:bg-red-700 rounded-lg font-medium shadow-sm transition-colors w-full">確認刪除</button></div>
                            </div>
                        </div>
                    )}
                    {isStorageFull && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[70]">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6 border-l-4 border-orange-500">
                                <h3 className="text-lg font-bold text-gray-900 mb-2">⚠️ 瀏覽器儲存空間已滿</h3><p className="text-sm text-gray-600 mb-4">您剛剛的操作**未能成功儲存**，因為您的瀏覽器本地儲存空間已經達到上限。</p><p className="text-sm text-gray-600 mb-6">請先「匯出 Excel」備份目前的資料，然後刪除看板上不需要的舊工作卡片以釋放空間。</p><button onClick={() => setIsStorageFull(false)} className="px-4 py-2 text-white bg-orange-500 hover:bg-orange-600 rounded-lg font-medium shadow-sm transition-colors w-full">我知道了</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        ReactDOM.render(<FocusTrackApp />, document.getElementById('root'));
    </script>
</body>
</html>
